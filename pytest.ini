[pytest]
DJANGO_SETTINGS_MODULE = knowledgeinjester.test_settings
env = 
    TEST_DB_NAME=test_knowledgeinjester
    TEST_DB_SSL=true
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --reuse-db
    --asyncio-mode=auto
testpaths = tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: API tests
    crawler: Crawler tests
    vectorizer: Vectorizer tests
    extractor: Extractor tests
    tenants: Tenant tests
    asyncio: Async tests