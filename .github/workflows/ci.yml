name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import check
        run: python - << 'PY'
import django, ninja_extra, langgraph, openai; print("imports ok")
PY
      - name: Docker build
        run: docker build -t knowledgeinjester:ci .
